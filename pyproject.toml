[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeonmi-claude-connector"
version = "0.1.0"
description = "Connector for Claude to utilize the Aeonmi/QUBE quantum syntax via MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
aeonmi-connector = "aeonmi_claude_connector:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aeonmi_claude_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
